# Alert thresholds
alerts:
  # Alert if a tracked investor enters or exits (crosses 0 threshold)
  notify_on_entry: true
  notify_on_exit: true
  # Alert if stake changes by more than this % in a single quarter
  stake_change_threshold_pct: 0.01
