# Investor Watchlist
# =====================
# Add FII, DII, mutual fund, or anchor investors you want to track.
# The shareholding_fetcher will alert you when any of these appear,
# increase, or decrease their stake in a watchlist company.
#
# How to add: just append names as they appear in BSE quarterly filings.
# Partial matches are used (e.g. "Mirae" matches "Mirae Asset Great Consumer Fund")

tracked_investors:

  fiis:
    - "Massachusetts Institute Of Technology"
    - "Malabar India Fund Limited"

  diis:
