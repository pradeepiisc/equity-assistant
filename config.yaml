llm:
  provider: azure_openai
  deployment: gpt-4.1
  temperature: 0.1
  max_tokens: 4096
  context_strategy: full_document   # never chunk unless forced

paths:
  data_root: data/companies
  prompts_root: prompts

skills:
  max_transcripts_per_company: 8    # last N quarters
  news_lookback_days: 30

output:
  format: markdown
  save_json_alongside: true         # save raw LLM JSON next to markdown
