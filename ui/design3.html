<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Design 3 — Two-Panel Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
body{background:#f8f9fb;margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.left-panel::-webkit-scrollbar-thumb{background:#334155}
.left-panel::-webkit-scrollbar-track{background:#0f172a}
.active-row{background:linear-gradient(90deg,rgba(99,102,241,0.15),rgba(99,102,241,0.05))}
.md h1{font-size:1.2rem;font-weight:700;color:#1e293b;border-bottom:2px solid #e2e8f0;padding-bottom:.5rem;margin:1.2rem 0 .5rem}
.md h2{font-size:1rem;font-weight:600;color:#334155;margin:.9rem 0 .3rem}
.md h3{font-size:.88rem;font-weight:600;color:#475569;margin:.6rem 0 .2rem}
.md p{color:#475569;margin:.3rem 0;line-height:1.65;font-size:.82rem}
.md ul,.md ol{padding-left:1.2rem;margin:.3rem 0}.md li{color:#475569;margin:.12rem 0;font-size:.82rem;line-height:1.55}
.md ul{list-style:disc}.md ol{list-style:decimal}
.md code{background:#f1f5f9;color:#7c3aed;padding:.06rem .22rem;border-radius:4px;font-size:.75rem}
.md pre{background:#f8fafc;padding:.5rem .7rem;border-radius:8px;overflow-x:auto;margin:.5rem 0;border:1px solid #e2e8f0}
.md pre code{background:none;padding:0}
.md table{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:.75rem}
.md th{background:#f8fafc;color:#64748b;padding:.3rem .5rem;border:1px solid #e2e8f0;font-weight:600;text-align:left}
.md td{padding:.25rem .5rem;border:1px solid #e2e8f0;color:#475569}
.md tr:nth-child(even) td{background:#fafbfd}
.md strong{color:#1e293b;font-weight:600}
.md blockquote{border-left:3px solid #6366f1;padding:.3rem .6rem;color:#64748b;margin:.4rem 0;background:#eef2ff;border-radius:0 6px 6px 0;font-size:.82rem}
.md a{color:#4f46e5}
.metric-card{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

const fmt=v=>{if(!v&&v!==0)return'—';const n=Number(String(v).replace(/,/g,''));if(isNaN(n))return v;if(Math.abs(n)>=100000)return'₹'+(n/100000).toFixed(1)+'L';return'₹'+n.toLocaleString('en-IN')};
const fmtP=v=>{if(!v&&v!==0)return'—';return(v>0?'+':'')+Number(v).toFixed(1)+'%'};

function LeftPanel({holdings,selected,onSelect,search,setSearch,user,setUser,total}){
  return(
    <div className="w-80 bg-slate-900 flex flex-col h-screen sticky top-0 left-panel shrink-0">
      {/* Header */}
      <div className="px-4 pt-5 pb-3">
        <h1 className="text-sm font-bold text-white flex items-center gap-2">
          <span className="w-6 h-6 bg-indigo-600 rounded-md flex items-center justify-center text-xs">P</span>
          Portfolio Explorer
        </h1>
        <div className="flex gap-1 mt-3 bg-slate-800 rounded-lg p-0.5">
          {['ZV3899','WN5759','combined'].map(u=>(
            <button key={u} onClick={()=>setUser(u)}
              className={`flex-1 py-1.5 text-[10px] font-medium rounded-md transition-colors ${user===u?'bg-indigo-600 text-white':'text-slate-400 hover:text-slate-200'}`}>
              {u==='combined'?'Family':u}
            </button>
          ))}
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Search symbol / name / sector..."
          className="w-full mt-3 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-indigo-500 placeholder:text-slate-500"/>
        <div className="text-[10px] text-slate-500 mt-2">
          Total: <span className="text-slate-300 font-semibold">₹{(total/100000).toFixed(1)}L</span> · {holdings.length} stocks
        </div>
      </div>

      {/* List */}
      <div className="flex-1 overflow-y-auto">
        {holdings.map((h,idx)=>{
          const isActive=selected===h.symbol;
          const pnlPos=h.pnl_pct>=0;
          return(
            <div key={h.symbol} onClick={()=>onSelect(h.symbol)}
              className={`px-4 py-2.5 cursor-pointer border-b border-slate-800/50 hover:bg-slate-800/50 transition-colors ${isActive?'active-row border-l-2 border-l-indigo-500':''}`}>
              <div className="flex items-center justify-between">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono text-indigo-400 shrink-0">{h.symbol}</span>
                    {h.red_flags>0&&<span className="w-1.5 h-1.5 rounded-full bg-red-500 shrink-0" title={`${h.red_flags} flags`}/>}
                  </div>
                  <div className="text-[11px] text-slate-400 truncate mt-0.5">{h.name}</div>
                </div>
                <div className="text-right shrink-0 ml-2">
                  <div className="text-xs font-mono text-slate-200">₹{h.last_price?.toFixed(0)}</div>
                  <div className={`text-[10px] font-mono ${pnlPos?'text-emerald-400':'text-red-400'}`}>{fmtP(h.pnl_pct)}</div>
                </div>
              </div>
              <div className="flex items-center justify-between mt-1">
                <span className="text-[10px] text-slate-600">{h.sector?.split(' - ')[0]||''}</span>
                <span className="text-[10px] text-slate-500">{fmt(h.current_value)} ({h.pct_of_portfolio}%)</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RightPanel({symbol}){
  const [data,setData]=useState(null);
  const [tab,setTab]=useState('overview');
  const scrollRef=useRef();

  useEffect(()=>{
    if(!symbol)return;
    setData(null);setTab('overview');
    fetch(`/api/dashboard/company/${symbol}`).then(r=>r.json()).then(setData);
  },[symbol]);

  useEffect(()=>{
    scrollRef.current?.scrollTo({top:0});
  },[tab,symbol]);

  if(!symbol)return(
    <div className="flex-1 flex items-center justify-center bg-gray-50">
      <div className="text-center">
        <div className="text-6xl mb-4 opacity-20">📊</div>
        <h2 className="text-lg font-semibold text-gray-400">Select a company</h2>
        <p className="text-sm text-gray-400 mt-1">Choose from the list to see the full dashboard</p>
      </div>
    </div>
  );

  if(!data)return <div className="flex-1 flex items-center justify-center bg-gray-50"><div className="text-gray-400">Loading {symbol}...</div></div>;
  if(data.error)return <div className="flex-1 flex items-center justify-center bg-gray-50"><div className="text-red-500">{data.error}</div></div>;

  const mr=data.master_report||{};
  const va=data.valuation||{};
  const fs=data.financial_snapshot||{};
  const fin=data.financials||{};
  const flags=data.flags||[];
  const dma=data.dma||{};
  const tabs=['overview','financials','valuation','thesis','reports'];

  const reds=flags.filter(f=>f.level==='red');
  const oranges=flags.filter(f=>f.level==='orange');
  const greens=flags.filter(f=>f.level==='green');

  return(
    <div className="flex-1 flex flex-col bg-gray-50 min-h-screen">
      {/* Company Header */}
      <div className="bg-white border-b border-gray-200 px-8 py-5 shrink-0">
        <div className="flex items-start justify-between">
          <div>
            <div className="flex items-center gap-3">
              <h1 className="text-xl font-bold text-gray-900">{data.meta?.name||symbol}</h1>
              {mr.overall_rating&&(
                <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${
                  mr.overall_rating==='Accumulate'?'bg-emerald-100 text-emerald-700':
                  mr.overall_rating==='Hold'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'}`}>{mr.overall_rating}</span>
              )}
            </div>
            <div className="flex items-center gap-3 mt-1.5 text-xs text-gray-500">
              <span className="font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">{symbol}</span>
              <span>{data.meta?.sector}</span>
            </div>
          </div>
        </div>

        {/* Metrics Strip */}
        <div className="grid grid-cols-7 gap-3 mt-5">
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">Price</div>
            <div className="text-lg font-bold text-gray-900 mt-0.5">₹{va.current_price||dma.last_price||'—'}</div>
          </div>
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">DMA 40</div>
            <div className={`text-lg font-bold mt-0.5 ${dma.dma40&&dma.last_price>dma.dma40?'text-emerald-600':'text-red-600'}`}>{dma.dma40?.toFixed(0)||'—'}</div>
          </div>
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">DMA 100</div>
            <div className={`text-lg font-bold mt-0.5 ${dma.dma100&&dma.last_price>dma.dma100?'text-emerald-600':'text-red-600'}`}>{dma.dma100?.toFixed(0)||'—'}</div>
          </div>
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">P/E</div>
            <div className="text-lg font-bold text-gray-800 mt-0.5">{fs.key_ratios?.pe_ratio||fin.ratios?.['stock_p/e']||'—'}</div>
          </div>
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">ROCE</div>
            <div className="text-lg font-bold text-gray-800 mt-0.5">{fs.key_ratios?.roce||fin.ratios?.roce||'—'}</div>
          </div>
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">ROE</div>
            <div className="text-lg font-bold text-gray-800 mt-0.5">{fs.key_ratios?.roe||fin.ratios?.roe||'—'}</div>
          </div>
          <div className="metric-card">
            <div className="text-[10px] text-gray-400 uppercase">Upside</div>
            <div className={`text-lg font-bold mt-0.5 ${va.upside_pct>0?'text-emerald-600':'text-red-600'}`}>{va.upside_pct?`${va.upside_pct>0?'+':''}${va.upside_pct}%`:'—'}</div>
          </div>
        </div>
      </div>

      {/* Flag Bands */}
      {flags.length>0&&(
        <div className="bg-white border-b border-gray-200 px-8 py-3 shrink-0">
          <div className="grid grid-cols-3 gap-4">
            {/* Red */}
            {reds.length>0&&(
              <div className="bg-red-50 border border-red-200 rounded-xl p-3">
                <div className="flex items-center gap-1.5 mb-2">
                  <span className="w-2 h-2 rounded-full bg-red-500"/>
                  <span className="text-[10px] font-bold text-red-700 uppercase">Warnings ({reds.length})</span>
                </div>
                {reds.map((f,i)=>(
                  <div key={i} className="text-xs text-red-700 mb-1 leading-relaxed">• {f.message}</div>
                ))}
              </div>
            )}
            {/* Orange */}
            {oranges.length>0&&(
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                <div className="flex items-center gap-1.5 mb-2">
                  <span className="w-2 h-2 rounded-full bg-amber-500"/>
                  <span className="text-[10px] font-bold text-amber-700 uppercase">Caution ({oranges.length})</span>
                </div>
                {oranges.map((f,i)=>(
                  <div key={i} className="text-xs text-amber-700 mb-1 leading-relaxed">• {f.message}</div>
                ))}
              </div>
            )}
            {/* Green */}
            {greens.length>0&&(
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3">
                <div className="flex items-center gap-1.5 mb-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"/>
                  <span className="text-[10px] font-bold text-emerald-700 uppercase">Positive ({greens.length})</span>
                </div>
                {greens.map((f,i)=>(
                  <div key={i} className="text-xs text-emerald-700 mb-1 leading-relaxed">• {f.message}</div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Tabs */}
      <div className="bg-white border-b border-gray-200 px-8 shrink-0">
        <div className="flex gap-0">
          {tabs.map(t=>(
            <button key={t} onClick={()=>setTab(t)}
              className={`px-5 py-3 text-xs font-medium capitalize border-b-2 transition-colors ${tab===t?'text-indigo-600 border-indigo-600':'text-gray-500 border-transparent hover:text-gray-700'}`}>{t}</button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div ref={scrollRef} className="flex-1 overflow-y-auto p-8">
        {tab==='overview'&&(
          <div className="grid grid-cols-2 gap-5">
            {/* Thesis */}
            <div className="col-span-2 bg-white rounded-xl border border-gray-200 p-5">
              <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Investment Thesis</h3>
              <p className="text-sm text-gray-700 leading-relaxed">{mr.investment_thesis||fs.summary||'No thesis available'}</p>
              {mr.action_recommendation&&(
                <div className="mt-3 bg-indigo-50 rounded-lg px-4 py-2.5 border border-indigo-100">
                  <p className="text-sm text-indigo-800 font-medium">{mr.action_recommendation}</p>
                </div>
              )}
            </div>

            {/* Valuation Range */}
            {va.fair_value_low&&(
              <div className="bg-white rounded-xl border border-gray-200 p-5">
                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-4">Fair Value Range</h3>
                <div className="flex items-center gap-3 mb-4">
                  <div className="text-center">
                    <div className="text-[10px] text-gray-400">Bear</div>
                    <div className="text-base font-bold text-red-600">₹{va.fair_value_low}</div>
                  </div>
                  <div className="flex-1 h-3 bg-gray-100 rounded-full relative">
                    {(()=>{
                      const lo=va.fair_value_low,hi=va.fair_value_high,cur=va.current_price;
                      const pct=hi-lo?Math.max(2,Math.min(98,(cur-lo)/(hi-lo)*100)):50;
                      return <>
                        <div className="absolute inset-0 rounded-full bg-gradient-to-r from-red-200 via-amber-200 to-emerald-200"/>
                        <div className="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full border-2 border-indigo-500 shadow-md" style={{left:`${pct}%`}}/>
                      </>;
                    })()}
                  </div>
                  <div className="text-center">
                    <div className="text-[10px] text-gray-400">Bull</div>
                    <div className="text-base font-bold text-emerald-600">₹{va.fair_value_high}</div>
                  </div>
                </div>
                {va.scenarios&&va.scenarios.map((s,i)=>(
                  <div key={i} className="flex items-center gap-2 mb-1.5 text-xs">
                    <span className={`w-2 h-2 rounded-full ${s.name==='Bull'?'bg-emerald-500':s.name==='Bear'?'bg-red-500':'bg-amber-500'}`}/>
                    <span className="text-gray-500 w-10 font-medium">{s.name}</span>
                    <span className="text-gray-800 font-mono">₹{s.fair_value}</span>
                    <span className="text-gray-400 ml-1">({s.probability})</span>
                    <span className="text-gray-500 flex-1 truncate ml-2">{s.description?.substring(0,80)}...</span>
                  </div>
                ))}
              </div>
            )}

            {/* Key Ratios */}
            <div className="bg-white rounded-xl border border-gray-200 p-5">
              <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Key Ratios</h3>
              <div className="grid grid-cols-2 gap-x-6 gap-y-2">
                {Object.entries(fs.key_ratios||fin.ratios||{}).map(([k,v])=>(
                  <div key={k} className="flex justify-between py-1.5 border-b border-gray-50">
                    <span className="text-xs text-gray-500 capitalize">{k.replace(/_/g,' ')}</span>
                    <span className="text-xs font-mono font-semibold text-gray-800">{v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Key Risks */}
            {mr.key_risks&&(
              <div className="bg-white rounded-xl border border-gray-200 p-5">
                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Key Risks</h3>
                <div className="space-y-2">
                  {(Array.isArray(mr.key_risks)?mr.key_risks:Object.entries(mr.key_risks||{})).slice(0,5).map((r,i)=>{
                    const text=typeof r==='string'?r:r[1]||r;
                    return <div key={i} className="text-xs text-gray-600 leading-relaxed flex items-start gap-2">
                      <span className="text-red-400 shrink-0 mt-0.5">⚠</span>{typeof text==='string'?text:JSON.stringify(text)}
                    </div>;
                  })}
                </div>
              </div>
            )}

            {/* Key Catalysts */}
            {mr.key_catalysts&&(
              <div className="bg-white rounded-xl border border-gray-200 p-5">
                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Key Catalysts</h3>
                <div className="space-y-2">
                  {(Array.isArray(mr.key_catalysts)?mr.key_catalysts:[]).slice(0,5).map((c,i)=>(
                    <div key={i} className="text-xs text-gray-600 leading-relaxed flex items-start gap-2">
                      <span className="text-emerald-500 shrink-0 mt-0.5">★</span>{typeof c==='string'?c:c.catalyst||JSON.stringify(c)}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Monitoring Triggers */}
            {mr.monitoring_triggers&&Array.isArray(mr.monitoring_triggers)&&(
              <div className="col-span-2 bg-amber-50 border border-amber-200 rounded-xl p-5">
                <h3 className="text-xs font-bold text-amber-700 uppercase tracking-wide mb-3">What to Monitor</h3>
                <div className="grid grid-cols-2 gap-2">
                  {mr.monitoring_triggers.map((t,i)=>(
                    <div key={i} className="text-xs text-amber-800 leading-relaxed flex items-start gap-2">
                      <span className="text-amber-600 shrink-0 mt-0.5">▸</span>{t}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {tab==='financials'&&(
          <div className="space-y-5">
            <div className="bg-white rounded-xl border border-gray-200 p-5 overflow-x-auto">
              <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Quarterly Results</h3>
              <table className="w-full text-xs">
                <thead>
                  <tr className="text-gray-500 border-b border-gray-200">
                    <th className="text-left py-2.5 px-3 font-semibold">Quarter</th>
                    <th className="text-right py-2.5 px-3 font-semibold">Revenue</th>
                    <th className="text-right py-2.5 px-3 font-semibold">Op Profit</th>
                    <th className="text-right py-2.5 px-3 font-semibold">OPM%</th>
                    <th className="text-right py-2.5 px-3 font-semibold">Net Profit</th>
                    <th className="text-right py-2.5 px-3 font-semibold">EPS</th>
                  </tr>
                </thead>
                <tbody>
                  {(fin.quarterly||[]).map((q,i)=>(
                    <tr key={i} className="border-b border-gray-100 hover:bg-gray-50">
                      <td className="py-2.5 px-3 text-gray-800 font-mono font-medium">{q.quarter}</td>
                      <td className="py-2.5 px-3 text-right text-gray-700">{q.sales}</td>
                      <td className="py-2.5 px-3 text-right text-gray-700">{q.op_profit}</td>
                      <td className="py-2.5 px-3 text-right text-gray-700">{q.opm}</td>
                      <td className="py-2.5 px-3 text-right text-gray-700">{q.net_profit}</td>
                      <td className="py-2.5 px-3 text-right text-gray-700">{q.eps}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {fin.cash_flow&&Object.keys(fin.cash_flow).length>0&&(
              <div className="bg-white rounded-xl border border-gray-200 p-5">
                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Cash Flow Statement</h3>
                {Object.entries(fin.cash_flow).map(([type,years])=>(
                  <div key={type} className="mb-3">
                    <div className="text-xs text-gray-500 font-medium capitalize mb-1.5">{type.replace(/_/g,' ')}</div>
                    <div className="flex gap-2 flex-wrap">
                      {Object.entries(years||{}).map(([yr,val])=>{
                        const neg=Number(String(val).replace(/,/g,''))<0;
                        return <div key={yr} className={`px-3 py-1.5 rounded-lg border text-xs font-mono ${neg?'bg-red-50 text-red-700 border-red-200':'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                          <span className="text-gray-500 mr-1">{yr}:</span>{val}
                        </div>;
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="bg-white rounded-xl border border-gray-200 p-5">
              <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Financial Summary</h3>
              <p className="text-sm text-gray-700 leading-relaxed">{fs.summary||'—'}</p>
            </div>
          </div>
        )}

        {tab==='valuation'&&(
          <div className="bg-white rounded-xl border border-gray-200 p-6">
            <div className="md" dangerouslySetInnerHTML={{__html:marked.parse(data.valuation_summary_md||'*No valuation summary available*')}}/>
          </div>
        )}

        {tab==='thesis'&&(
          <div className="bg-white rounded-xl border border-gray-200 p-6">
            <div className="md" dangerouslySetInnerHTML={{__html:marked.parse(data.master_report_md||data.thesis_review_md||'*No report available*')}}/>
          </div>
        )}

        {tab==='reports'&&(
          <div className="grid grid-cols-3 gap-3">
            {(data.reports||[]).map(r=>(
              <a key={r.name} href={`/api/report-content?path=${encodeURIComponent(r.path)}`} target="_blank"
                className="bg-white border border-gray-200 rounded-xl p-4 hover:border-indigo-400 hover:shadow-md transition-all">
                <div className="text-sm font-medium text-gray-800">{r.name}</div>
                <div className="text-xs text-gray-400 mt-1.5">{r.modified} · {(r.size/1024).toFixed(1)}KB</div>
              </a>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [holdings,setHoldings]=useState([]);
  const [total,setTotal]=useState(0);
  const [user,setUser]=useState('combined');
  const [search,setSearch]=useState('');
  const [selected,setSelected]=useState(null);

  useEffect(()=>{
    fetch(`/api/dashboard/holdings?user=${user}`).then(r=>r.json()).then(d=>{
      setHoldings(d.holdings||[]);
      setTotal(d.total_value||0);
      if(!selected&&d.holdings?.length)setSelected(d.holdings[0].symbol);
    });
  },[user]);

  const filtered=useMemo(()=>{
    if(!search)return holdings;
    const q=search.toLowerCase();
    return holdings.filter(h=>h.symbol.toLowerCase().includes(q)||h.name.toLowerCase().includes(q)||h.sector.toLowerCase().includes(q));
  },[holdings,search]);

  return(
    <div className="flex min-h-screen">
      <LeftPanel holdings={filtered} selected={selected} onSelect={setSelected}
        search={search} setSearch={setSearch} user={user} setUser={setUser} total={total}/>
      <RightPanel symbol={selected}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
