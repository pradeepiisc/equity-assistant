<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Design 2 — Card Grid</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
body{background:#fafbfd;margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.card-hover:hover{box-shadow:0 4px 20px rgba(0,0,0,0.08);transform:translateY(-1px)}
.md h1{font-size:1.25rem;font-weight:700;color:#1e293b;border-bottom:2px solid #e2e8f0;padding-bottom:.5rem;margin:1rem 0 .5rem}
.md h2{font-size:1rem;font-weight:600;color:#334155;margin:.8rem 0 .3rem}
.md h3{font-size:.9rem;font-weight:600;color:#475569;margin:.6rem 0 .2rem}
.md p{color:#475569;margin:.3rem 0;line-height:1.65;font-size:.83rem}
.md ul,.md ol{padding-left:1.2rem;margin:.3rem 0}.md li{color:#475569;margin:.12rem 0;font-size:.83rem;line-height:1.55}
.md ul{list-style:disc}.md ol{list-style:decimal}
.md code{background:#f1f5f9;color:#7c3aed;padding:.08rem .25rem;border-radius:4px;font-size:.76rem}
.md pre{background:#f8fafc;padding:.5rem .7rem;border-radius:8px;overflow-x:auto;margin:.5rem 0;border:1px solid #e2e8f0}
.md pre code{background:none;padding:0}
.md table{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:.76rem}
.md th{background:#f8fafc;color:#64748b;padding:.35rem .5rem;border:1px solid #e2e8f0;font-weight:600;text-align:left}
.md td{padding:.3rem .5rem;border:1px solid #e2e8f0;color:#475569}
.md tr:nth-child(even) td{background:#fafbfd}
.md strong{color:#1e293b;font-weight:600}
.md blockquote{border-left:3px solid #3b82f6;padding:.2rem .6rem;color:#64748b;margin:.4rem 0;background:#f0f9ff;border-radius:0 4px 4px 0}
.md a{color:#3b82f6}
.slide-enter{animation:slideIn .25s ease-out}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

const fmt=v=>{if(!v&&v!==0)return'—';const n=Number(String(v).replace(/,/g,''));if(isNaN(n))return v;if(Math.abs(n)>=100000)return'₹'+(n/100000).toFixed(1)+'L';return'₹'+n.toLocaleString('en-IN')};
const fmtP=v=>{if(!v&&v!==0)return'—';return(v>0?'+':'')+Number(v).toFixed(1)+'%'};

function FlagPill({level,text}){
  const colors={red:'bg-red-100 text-red-700 border-red-200',orange:'bg-amber-50 text-amber-700 border-amber-200',green:'bg-emerald-50 text-emerald-700 border-emerald-200'};
  return <span className={`px-2 py-0.5 rounded-full text-[10px] font-medium border ${colors[level]||colors.green}`}>{text}</span>;
}

function MetricPill({label,value,positive}){
  return(
    <div className="bg-white rounded-lg border border-gray-200 px-3 py-2 text-center">
      <div className="text-[10px] text-gray-500 uppercase tracking-wide">{label}</div>
      <div className={`text-sm font-semibold mt-0.5 ${positive===true?'text-emerald-600':positive===false?'text-red-600':'text-gray-800'}`}>{value}</div>
    </div>
  );
}

function CompanyCard({h,onClick}){
  const pnlPositive=h.pnl_pct>=0;
  const dmaOk=h.dma40?h.last_price>h.dma40:null;
  return(
    <div onClick={onClick}
      className="bg-white rounded-xl border border-gray-200 p-4 cursor-pointer card-hover transition-all duration-200">
      {/* Header */}
      <div className="flex items-start justify-between mb-3">
        <div>
          <div className="text-sm font-semibold text-gray-900 leading-tight">{h.name}</div>
          <div className="flex items-center gap-2 mt-0.5">
            <span className="text-xs font-mono text-indigo-600">{h.symbol}</span>
            <span className="text-[10px] text-gray-400 truncate max-w-[100px]">{h.sector}</span>
          </div>
        </div>
        <div className="text-right">
          <div className="text-base font-bold text-gray-900">₹{h.last_price?.toFixed(0)}</div>
          <div className={`text-xs font-semibold ${pnlPositive?'text-emerald-600':'text-red-600'}`}>{fmtP(h.pnl_pct)}</div>
        </div>
      </div>

      {/* Value Bar */}
      <div className="bg-gray-50 rounded-lg px-3 py-2 mb-3 flex items-center justify-between">
        <div>
          <div className="text-[10px] text-gray-500">Investment</div>
          <div className="text-sm font-semibold text-gray-800">{fmt(h.current_value)}</div>
        </div>
        <div className="text-right">
          <div className="text-[10px] text-gray-500">Portfolio</div>
          <div className="text-sm font-semibold text-gray-800">{h.pct_of_portfolio}%</div>
        </div>
        <div className="text-right">
          <div className="text-[10px] text-gray-500">Qty</div>
          <div className="text-sm font-mono text-gray-600">{h.quantity}</div>
        </div>
      </div>

      {/* DMA Badge */}
      <div className="flex items-center gap-2 mb-2">
        {h.dma40&&(
          <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${dmaOk?'bg-emerald-50 text-emerald-700 border border-emerald-200':'bg-red-50 text-red-700 border border-red-200'}`}>
            {dmaOk?'Above':'Below'} DMA40 ({h.dma40?.toFixed(0)})
          </span>
        )}
        {h.dma100&&(
          <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${h.last_price>h.dma100?'bg-emerald-50 text-emerald-700 border border-emerald-200':'bg-red-50 text-red-700 border border-red-200'}`}>
            DMA100 ({h.dma100?.toFixed(0)})
          </span>
        )}
      </div>

      {/* Flags Summary */}
      <div className="flex items-center gap-1 flex-wrap">
        {h.red_flags>0&&<FlagPill level="red" text={`${h.red_flags} warning${h.red_flags>1?'s':''}`}/>}
        {h.has_reports&&<FlagPill level="green" text="Reports"/>}
        {!h.has_reports&&<FlagPill level="orange" text="No Reports"/>}
        {h.users?.length>1&&<FlagPill level="green" text="Both Users"/>}
      </div>
    </div>
  );
}

function DetailPanel({symbol,onClose}){
  const [data,setData]=useState(null);
  const [tab,setTab]=useState('overview');
  useEffect(()=>{
    fetch(`/api/dashboard/company/${symbol}`).then(r=>r.json()).then(setData);
  },[symbol]);

  if(!data)return(
    <div className="fixed inset-y-0 right-0 w-[55%] bg-white border-l border-gray-200 shadow-2xl z-50 slide-enter flex items-center justify-center">
      <div className="text-gray-400">Loading {symbol}...</div>
    </div>
  );

  const mr=data.master_report||{};
  const va=data.valuation||{};
  const fs=data.financial_snapshot||{};
  const fin=data.financials||{};
  const flags=data.flags||[];
  const dma=data.dma||{};
  const tabs=['overview','financials','valuation','thesis','reports'];

  return(
    <>
    <div className="fixed inset-0 bg-black/20 z-40" onClick={onClose}/>
    <div className="fixed inset-y-0 right-0 w-[55%] bg-white border-l border-gray-200 shadow-2xl z-50 slide-enter flex flex-col overflow-hidden">
      {/* Header */}
      <div className="px-6 py-4 border-b border-gray-100 shrink-0">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-lg font-bold text-gray-900">{data.meta?.name||symbol}</h2>
            <div className="flex items-center gap-3 mt-1">
              <span className="text-xs font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">{symbol}</span>
              <span className="text-xs text-gray-500">{data.meta?.sector}</span>
              {mr.overall_rating&&(
                <span className={`text-xs font-bold px-2 py-0.5 rounded ${
                  mr.overall_rating==='Accumulate'?'bg-emerald-100 text-emerald-700':
                  mr.overall_rating==='Hold'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'
                }`}>{mr.overall_rating}</span>
              )}
            </div>
          </div>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-gray-600 text-xl">×</button>
        </div>

        {/* Metrics Row */}
        <div className="grid grid-cols-5 gap-2 mt-4">
          <MetricPill label="Price" value={`₹${va.current_price||dma.last_price||'—'}`}/>
          <MetricPill label="DMA40" value={dma.dma40?.toFixed(0)||'—'} positive={dma.dma40?dma.last_price>dma.dma40:null}/>
          <MetricPill label="DMA100" value={dma.dma100?.toFixed(0)||'—'} positive={dma.dma100?dma.last_price>dma.dma100:null}/>
          <MetricPill label="P/E" value={fs.key_ratios?.pe_ratio||fin.ratios?.['stock_p/e']||'—'}/>
          <MetricPill label="ROCE" value={fs.key_ratios?.roce||fin.ratios?.roce||'—'}/>
        </div>
      </div>

      {/* Flags Banner */}
      {flags.length>0&&(
        <div className="px-6 py-3 bg-gray-50 border-b border-gray-100 shrink-0">
          <div className="flex flex-wrap gap-1.5">
            {flags.map((f,i)=>(
              <span key={i} className={`inline-flex items-center gap-1 text-[11px] px-2 py-1 rounded-md border ${
                f.level==='red'?'bg-red-50 text-red-700 border-red-200':
                f.level==='orange'?'bg-amber-50 text-amber-700 border-amber-200':
                'bg-emerald-50 text-emerald-700 border-emerald-200'
              }`}>
                <span className={`w-1.5 h-1.5 rounded-full ${f.level==='red'?'bg-red-500':f.level==='orange'?'bg-amber-500':'bg-emerald-500'}`}/>
                {f.category}: {f.message}
              </span>
            ))}
          </div>
        </div>
      )}

      {/* Tabs */}
      <div className="flex border-b border-gray-200 px-6 shrink-0">
        {tabs.map(t=>(
          <button key={t} onClick={()=>setTab(t)}
            className={`px-4 py-2.5 text-xs font-medium capitalize border-b-2 transition-colors ${tab===t?'text-indigo-600 border-indigo-600':'text-gray-500 border-transparent hover:text-gray-700'}`}>{t}</button>
        ))}
      </div>

      {/* Content */}
      <div className="flex-1 overflow-y-auto p-6">
        {tab==='overview'&&(
          <div className="space-y-5">
            {/* Thesis */}
            <div>
              <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Investment Thesis</h3>
              <p className="text-sm text-gray-700 leading-relaxed">{mr.investment_thesis||fs.summary||'Not available'}</p>
              {mr.action_recommendation&&<p className="text-sm text-indigo-600 mt-2 font-medium">{mr.action_recommendation}</p>}
            </div>

            {/* Valuation Range */}
            {va.fair_value_low&&(
              <div className="bg-gray-50 rounded-xl p-4">
                <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Fair Value Range</h3>
                <div className="flex items-center gap-4">
                  <span className="text-sm font-bold text-red-600">₹{va.fair_value_low}</span>
                  <div className="flex-1 h-2.5 bg-gray-200 rounded-full relative">
                    {(()=>{
                      const lo=va.fair_value_low,hi=va.fair_value_high,cur=va.current_price;
                      const pct=hi-lo?Math.max(0,Math.min(100,(cur-lo)/(hi-lo)*100)):50;
                      return <>
                        <div className="absolute inset-0 bg-gradient-to-r from-red-300 via-amber-300 to-emerald-300 rounded-full"/>
                        <div className="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full border-2 border-indigo-500 shadow" style={{left:`${pct}%`}}/>
                      </>;
                    })()}
                  </div>
                  <span className="text-sm font-bold text-emerald-600">₹{va.fair_value_high}</span>
                </div>
                <div className="text-center mt-1.5 text-xs text-gray-500">Current: ₹{va.current_price} ({va.upside_pct>0?'+':''}{va.upside_pct}% to base)</div>
              </div>
            )}

            {/* Key Ratios Grid */}
            <div>
              <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Key Ratios</h3>
              <div className="grid grid-cols-4 gap-2">
                {Object.entries(fs.key_ratios||fin.ratios||{}).slice(0,8).map(([k,v])=>(
                  <div key={k} className="bg-white border border-gray-200 rounded-lg px-3 py-2">
                    <div className="text-[10px] text-gray-400 uppercase">{k.replace(/_/g,' ')}</div>
                    <div className="text-sm font-semibold text-gray-800 mt-0.5">{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Monitoring */}
            {mr.monitoring_triggers&&Array.isArray(mr.monitoring_triggers)&&(
              <div>
                <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">What to Monitor</h3>
                <ul className="space-y-1.5">
                  {mr.monitoring_triggers.map((t,i)=>(
                    <li key={i} className="text-xs text-gray-600 flex items-start gap-2 leading-relaxed">
                      <span className="text-amber-500 shrink-0">▸</span>{t}
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>
        )}

        {tab==='financials'&&(
          <div className="space-y-4">
            <div className="overflow-x-auto">
              <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Quarterly Results</h3>
              <table className="w-full text-xs border border-gray-200 rounded-lg overflow-hidden">
                <thead>
                  <tr className="bg-gray-50 text-gray-500">
                    <th className="text-left py-2 px-3 font-medium">Quarter</th>
                    <th className="text-right py-2 px-3">Sales</th>
                    <th className="text-right py-2 px-3">Op Profit</th>
                    <th className="text-right py-2 px-3">OPM%</th>
                    <th className="text-right py-2 px-3">Net Profit</th>
                    <th className="text-right py-2 px-3">EPS</th>
                  </tr>
                </thead>
                <tbody>
                  {(fin.quarterly||[]).map((q,i)=>(
                    <tr key={i} className="border-t border-gray-100">
                      <td className="py-2 px-3 text-gray-700 font-mono">{q.quarter}</td>
                      <td className="py-2 px-3 text-right text-gray-800">{q.sales}</td>
                      <td className="py-2 px-3 text-right text-gray-800">{q.op_profit}</td>
                      <td className="py-2 px-3 text-right text-gray-800">{q.opm}</td>
                      <td className="py-2 px-3 text-right text-gray-800">{q.net_profit}</td>
                      <td className="py-2 px-3 text-right text-gray-800">{q.eps}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {fin.cash_flow&&Object.keys(fin.cash_flow).length>0&&(
              <div>
                <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Cash Flow</h3>
                {Object.entries(fin.cash_flow).map(([type,years])=>(
                  <div key={type} className="mb-2">
                    <div className="text-xs text-gray-400 capitalize mb-1">{type.replace(/_/g,' ')}</div>
                    <div className="flex gap-2 flex-wrap">
                      {Object.entries(years||{}).map(([yr,val])=>{
                        const neg=Number(String(val).replace(/,/g,''))<0;
                        return <span key={yr} className={`text-xs px-2 py-1 rounded border ${neg?'bg-red-50 text-red-700 border-red-200':'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>{yr}: {val}</span>;
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <h3 className="text-xs font-semibold text-indigo-500 uppercase tracking-wide mb-2">Financial Summary</h3>
              <p className="text-sm text-indigo-900 leading-relaxed">{fs.summary||'—'}</p>
            </div>
          </div>
        )}

        {tab==='valuation'&&<div className="md" dangerouslySetInnerHTML={{__html:marked.parse(data.valuation_summary_md||'*No valuation summary*')}}/>}
        {tab==='thesis'&&<div className="md" dangerouslySetInnerHTML={{__html:marked.parse(data.master_report_md||data.thesis_review_md||'*No report*')}}/>}
        {tab==='reports'&&(
          <div className="grid grid-cols-2 gap-3">
            {(data.reports||[]).map(r=>(
              <a key={r.name} href={`/api/report-content?path=${encodeURIComponent(r.path)}`} target="_blank"
                className="bg-white border border-gray-200 rounded-xl p-4 hover:border-indigo-400 transition-colors">
                <div className="text-sm font-medium text-gray-800">{r.name}</div>
                <div className="text-xs text-gray-400 mt-1">{r.modified} · {(r.size/1024).toFixed(1)}KB</div>
              </a>
            ))}
          </div>
        )}
      </div>
    </div>
    </>
  );
}

function App(){
  const [holdings,setHoldings]=useState([]);
  const [total,setTotal]=useState(0);
  const [user,setUser]=useState('combined');
  const [search,setSearch]=useState('');
  const [selected,setSelected]=useState(null);

  useEffect(()=>{
    fetch(`/api/dashboard/holdings?user=${user}`).then(r=>r.json()).then(d=>{
      setHoldings(d.holdings||[]);setTotal(d.total_value||0);
    });
  },[user]);

  const filtered=useMemo(()=>{
    if(!search)return holdings;
    const q=search.toLowerCase();
    return holdings.filter(h=>h.symbol.toLowerCase().includes(q)||h.name.toLowerCase().includes(q)||h.sector.toLowerCase().includes(q));
  },[holdings,search]);

  return(
    <div className="min-h-screen">
      {/* Header */}
      <div className="bg-white border-b border-gray-200 px-8 py-5 sticky top-0 z-30">
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-xl font-bold text-gray-900">Portfolio Dashboard</h1>
            <p className="text-sm text-gray-500 mt-0.5">Design 2 — Card Grid · {holdings.length} companies · ₹{(total/100000).toFixed(1)}L total</p>
          </div>
          <div className="flex items-center gap-3">
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search..."
              className="border border-gray-300 rounded-xl px-4 py-2 text-sm w-56 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200"/>
            <div className="flex bg-gray-100 rounded-xl overflow-hidden">
              {['ZV3899','WN5759','combined'].map(u=>(
                <button key={u} onClick={()=>setUser(u)}
                  className={`px-4 py-2 text-xs font-medium transition-colors ${user===u?'bg-indigo-600 text-white':'text-gray-600 hover:text-gray-800'}`}>
                  {u==='combined'?'Family':u}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Grid */}
      <div className="p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        {filtered.map(h=>(
          <CompanyCard key={h.symbol} h={h} onClick={()=>setSelected(h.symbol)}/>
        ))}
      </div>

      {selected&&<DetailPanel symbol={selected} onClose={()=>setSelected(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
