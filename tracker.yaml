# Stock tracker settings — uncomment a line to override the default shown.
# (defaults live in tracker/config.py)

# accounts: [ZV3899, WN5759, CQN676]  # Kite accounts whose holdings.json define the portfolio (and the 16:00 job)

technicals:
  # phase_fast: 40                    # phase = price vs DMA40 vs DMA100 (same rule as the daily report)
  # phase_slow: 100
  # neutral_band_pct: 3               # within ±3% of DMA100 → Neutral
  # cross_lines: [40, 200]            # alert when the close crosses these DMAs
  # golden_cross: [50, 200]           # golden / death cross pair
  # cross_confirm_pct: 0.5            # close must clear the line by 0.5% (stops whipsaw alerts)
  # volume_spike_x: 3                 # volume ≥ 3× 20-day average …
  # volume_spike_min_move_pct: 3      # … with a ≥3% price move

alerts:
  # notify_macos: true
  # min_push_severity: high           # pushed as macOS notifications: high
  # min_inbox_severity: medium        # shown in the dashboard inbox: medium and high
  # quiet_hours: ["23:00", "07:00"]   # held, then sent as one summary
  # max_push_per_run: 4               # more than this → a single summary notification

orders:
  # high_pct_of_revenue: 5            # order win ≥ 5% of trailing-12M revenue → high
  # usd_inr: 88                       # converts USD order values

shareholding:
  # promoter_change_pp: 1.0           # quarter-on-quarter change that raises an event
  # institution_change_pp: 1.5
  # anchor_change_pp: 0.5             # a named anchor investor moving this much raises an event

schedule:
  # feeds_from: "07:00"               # NSE filing feeds polled in this window
  # feeds_to: "23:30"
  # feeds_every_min: 10               # all NSE feeds…
  # market_from: "09:00"              # …except announcements, every 3 min on weekdays 09:00–18:00
  # market_to: "18:00"                #    (decided 2026-10-18)
  # announcements_every_min: 3
  # deals_after: "17:15"              # NSE bulk/block deals file
  # eod_after: "18:15"                # bhavcopy prices
  # server_poll: true                 # `serve` ticks at start-up, then every server_every_min
  # server_every_min: 3
  # launchd_every_min: 3              # used by the Install button on the Status page

# ── Phase 2 ─────────────────────────────────────────────────────────────────
documents:                            # filings → PDFs → LLM extraction (the only LLM use)
  # enabled: true
  # kinds: [results, concall_transcript, concall, order_win, capacity, acquisition, update]
  # max_seconds_per_tick: 60
  # backfill: true                    # also read the PDFs already under data/companies/*/ (newest first)
  # backfill_since: "2023-01-01"

llm:
  # enabled: true
  # client: client_gpt41_itam         # gpt-4.1 via llm/client.py (decided 2026-10-18)
  daily_budget_inr: 10000             # ₹ per IST day, all LLM calls — edit this number to change it (next tick picks it up)
  # backfill_share: 0.6               # back-fill may use 60% of it; the rest stays free for new filings
  # max_input_tokens: 14000           # per document, relevant pages only
  # max_output_tokens: 4000
  # request_timeout_s: 120            # per call (one retry), so a stalled request can't hold a tick
  # local_model: qwen3.8:27b          # ollama on this Mac (free): company profiles and policy matching
  # local_url: http://127.0.0.1:11434

# policy:                             # PIB releases → policy events (policy.py)
#   every_min: 180                    # within schedule.feeds_from–feeds_to

# movers:                             # unusual end-of-day moves and their trigger (movers.py)
#   min_move_pct: 4.0                 # main board: this move and…
#   z_main: 2.0                       # …this many σ of its own 60-session daily moves
#   z_any: 3.0                        # any move this many σ
#   vol_move_pct: 2.5                 # or this move on…
#   vol_x: 3.0                        # …this multiple of its usual volume
#   sme_vol_x: 2.0                    # SME: beyond its last 5 sessions' moves on this volume multiple
#   sme_min_pct: 3.0
#   max_rows: 20
#   per_tick: 5                       # reasons filled per tick (local model)

screener_fallback:                    # BSE-only stocks, through the Chrome debug session only
  # enabled: true
  # daily_pages: 300                 # Screener page loads per day
  # per_tick: 2                       # companies per 3-minute tick
  # check_hours: {meeting: 0.75, season: 3, quiet: 12}   # board-meeting day / results season / otherwise
  # launch_chrome: true               # start the dedicated debug profile (your own Chrome is left alone)
  # min_gap_s: 9                      # between any two Screener requests
  # window: ["08:00", "22:00"]
  # stale_days: 30
  # results_refresh_days: 7

score:                                # Add / Hold / Trim / Exit / Watch — rule-based, no LLM
  # add_at: 4.0
  # trim_at: -1.5
  # exit_at: -4.0
  # watch_add_at: 3.0
  # min_components: 4
  # default_execution_months: 24
  # weights:                          # each component scores −2…+2 × weight
  #   order_book_growth: 1.0
  #   book_to_revenue: 0.75
  #   guidance_delivery: 1.0
  #   margin_trend: 0.75
  #   eps_vs_pe: 1.0
  #   technical: 1.0
  #   promoter_flow: 1.0
  #   institution_flow: 0.5
  #   anchor_flow: 0.5
  #   pledge: 1.0
  #   valuation: 0.75

